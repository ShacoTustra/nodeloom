# Nodeloom: config.toml in the working directory or the data directory (or `nodeloom --config path`).
# Environment variables win over this file. Every section is optional.

# ---------------------------------------------------------------- providers
# type = "openai": the OpenAI API and what speaks it. type = "google": Google's Gemini API. type = "ark": BytePlus
# ModelArk / Volcengine Ark. type = "fal": fal.ai. type = "replicate": Replicate. OPENAI_API_KEY, GEMINI_API_KEY,
# OPENROUTER_API_KEY, FAL_KEY, REPLICATE_API_TOKEN and ARK_API_KEY alone also create "openai", "google",
# "openrouter", "fal", "replicate" and "ark".

[providers.openai]
type = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"        # or api_key = "sk-..."
# Without `models`, the list comes from GET /models (asked again every 10 minutes). A list of ids limits it:
# models = ["gpt-5-mini", "gpt-image-1"]

# Settings for some models, or models the list does not have. kind: chat | image | video; inputs: what a chat model
# takes besides text (image, audio, video); price: US$ per million tokens (input, output, image_input) or per
# generated image (image). Without a price the cost of a run is not shown in full.
[providers.openai.extra_models."gpt-image-1"]
price = { input = 5.0, image_input = 10.0, output = 40.0 }

[providers.google]
type = "google"
api_key_env = "GEMINI_API_KEY"
# Gemini text models go to the text model node, Nano Banana to "Gemini image", Omni to "Gemini video" (the id tells).
# Google prices pictures and video by their output tokens: input / output per million tokens.
[providers.google.extra_models."gemini-3.1-flash-image"]
price = { input = 1.5, output = 30.0 }
[providers.google.extra_models."gemini-omni-1.1-flash"]
price = { input = 1.5, output = 17.5 }

[providers.openrouter]
type = "openai"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
models = ["google/gemini-2.5-flash", "anthropic/claude-sonnet-4.5"]   # OpenRouter lists hundreds: pick yours

[providers.fal]
type = "fal"
api_key_env = "FAL_KEY"
# Every endpoint is a node of its own, made of its API schema. Without `endpoints`: a list of popular ones.
# price: US$ per request (fal says no price in its answers).
[providers.fal.endpoints."fal-ai/flux/dev"]
price = { request = 0.025 }
[providers.fal.endpoints."fal-ai/nano-banana/edit"]
[providers.fal.endpoints."fal-ai/kling-video/v2.1/standard/image-to-video"]
[providers.fal.endpoints."fal-ai/elevenlabs/tts/turbo-v2.5"]
title = "Voice (ElevenLabs)"

[providers.replicate]
type = "replicate"
api_key_env = "REPLICATE_API_TOKEN"
# Every model is a node of its own, made of its version's API schema: "owner/name" (an official model, or the latest
# version of any other), or "owner/name:<version id>" to keep one version. Without `endpoints`: popular ones.
# price: request (per run), image (per picture), second (per second of run time: community models' hardware price).
# kind: image | video | audio, when the node takes a model's output for the wrong kind of file.
[providers.replicate.endpoints."black-forest-labs/flux-schnell"]
price = { image = 0.003 }
[providers.replicate.endpoints."kwaivgi/kling-v2.5-turbo-pro"]
[providers.replicate.endpoints."openai/whisper"]
price = { second = 0.000975 }

[providers.local]
type = "openai"
base_url = "http://localhost:11434/v1"   # Ollama; LM Studio: http://localhost:1234/v1
models = ["llama3.2"]

[providers.ark]
type = "ark"
base_url = "https://ark.ap-southeast.bytepluses.com/api/v3"
api_key_env = "ARK_API_KEY"
# ModelArk needs dated model ids (dreamina-seedance-2-0-260128); its GET /models lists them.

[providers.ark.extra_models."dreamina-seedance-2-0-260128"]
price = { output = 7.0 }                 # Seedance is billed by video tokens

